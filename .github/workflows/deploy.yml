name: Check and deploy SwampWiki

on:
  push:
    branches: [main]

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate the Swampland text navigator
        run: |
          npm run build
          npm test
          npm run check:site

      - name: Report skipped deployment
        if: ${{ always() && vars.CLOUDFLARE_DEPLOY_ENABLED != 'true' }}
        run: echo 'Cloudflare deployment skipped. Set CLOUDFLARE_DEPLOY_ENABLED to true after domain and credential setup.' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy SwampWiki
        if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Missing SwampWiki repository secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing SwampWiki repository secret CLOUDFLARE_ACCOUNT_ID}"
          ./node_modules/.bin/wrangler deploy --config wrangler.toml
