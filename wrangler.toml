name = "swampwiki"
main = "backend/site.mjs"
compatibility_date = "2026-11-18"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "swampwiki.com", custom_domain = true },
  { pattern = "www.swampwiki.com", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
# The www redirect also applies to existing HTML and static files.
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[observability.logs]
enabled = true
head_sampling_rate = 0.1

[observability.traces]
enabled = true
head_sampling_rate = 0.1
